<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
          --bg:#090909;
          --card:#151515;
          --card-2:#202020;
          --accent:#33ff99;
          --accent-dim:rgba(51,255,153,.18);
          --text:#ffffff;
          --muted:#8b8b8b;
          --border:rgba(255,255,255,.06);
          --radius:18px;
          --ease:cubic-bezier(.22,1,.36,1);
        }
        html,body{background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
        body{overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        a{color:inherit;text-decoration:none}
        
        .error-container{
          position:relative;
          max-width:480px;
          width:100%;
          background:var(--card);
          border:1px solid var(--border);
          border-radius:var(--radius);
          padding:48px 32px;
          text-align:center;
          box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 40px var(--accent-dim);
          animation:fadeUp .5s var(--ease);
        }

        @keyframes fadeUp{
          from{opacity:0;transform:translateY(16px)}
          to{opacity:1;transform:none}
        }

        .error-icon-wrap{
          width:80px;
          height:80px;
          margin:0 auto 24px;
          border-radius:24px;
          background:var(--accent-dim);
          border:1px solid rgba(51,255,153,.3);
          display:grid;
          place-items:center;
          color:var(--accent);
          box-shadow:0 0 30px var(--accent-dim);
        }

        .error-code{
          font-size:12px;
          font-weight:700;
          letter-spacing:2px;
          text-transform:uppercase;
          color:var(--accent);
          margin-bottom:8px;
        }

        h1{
          font-size:28px;
          font-weight:800;
          letter-spacing:-.5px;
          margin-bottom:12px;
        }

        p{
          color:var(--muted);
          font-size:15px;
          line-height:1.5;
          margin-bottom:32px;
        }

        .error-actions{
          display:flex;
          gap:12px;
          justify-content:center;
          flex-wrap:wrap;
        }

        .btn-accent{
          display:inline-flex;
          align-items:center;
          justify-content:center;
          gap:8px;
          padding:12px 24px;
          border-radius:12px;
          background:var(--accent);
          color:#000;
          font-weight:700;
          font-size:14px;
          transition:.2s var(--ease);
        }

        .btn-accent:hover{
          transform:translateY(-2px);
          box-shadow:0 8px 24px var(--accent-dim);
        }

        .btn-ghost{
          display:inline-flex;
          align-items:center;
          justify-content:center;
          gap:8px;
          padding:12px 20px;
          border-radius:12px;
          background:var(--card-2);
          color:#fff;
          font-weight:600;
          font-size:14px;
          border:1px solid var(--border);
          transition:.2s var(--ease);
        }

        .btn-ghost:hover{
          border-color:var(--accent);
          color:var(--accent);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon-wrap">
            <i data-lucide="ghost" size="38"></i>
        </div>
        <div class="error-code">Error 404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <div class="error-actions">
            <a href="/" class="btn-accent">
                <i data-lucide="home" size="18"></i>
                Back to Home
            </a>
            <button onclick="history.back()" class="btn-ghost">
                <i data-lucide="arrow-left" size="18"></i>
                Go Back
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
